[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envvault"
version = "0.1.0"
description = "Bóveda cifrada para los .env y tokens de todos tus proyectos, con CLI y TUI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.27.3",
    "rich>=15.0.0",
    "textual>=8.2.8",
    "cryptography>=44",
    "keyring>=24",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.4.0", "respx>=0.21"]

[project.scripts]
envvault = "envvault.cli:main"
ev = "envvault.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
